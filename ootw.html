
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Flecha</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: black;
  user-select: none;
  touch-action: manipulation;

  display: flex;
  justify-content: center;
  align-items: center;
}

#arrow {
  width: 65vw;
  max-width: 300px;
  aspect-ratio: 1 / 1;
  visibility: visible;
}
</style>
</head>

<body>

<svg id="arrow" viewBox="0 0 200 200">

  <path
    d="M100 12
       L55 85
       L85 85
       L85 188
       L115 188
       L115 85
       L145 85
       Z"
    fill="white"
  />

</svg>

<script>

const arrow = document.getElementById("arrow");

let changing = false;

document.addEventListener("click", function() {

  if (changing) return;

  changing = true;

  // Ocultar flecha
  arrow.style.visibility = "hidden";

  // Seleccionar dirección aleatoria
  const direction = Math.random() < 0.5 ? -45 : 45;

  setTimeout(function() {

    // Cambiar dirección
    arrow.style.transform = `rotate(${direction}deg)`;

    // Mostrar flecha
    arrow.style.visibility = "visible";

    changing = false;

  }, 150);

});

</script>

</body>
</html>
