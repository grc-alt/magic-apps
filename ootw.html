```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Flecha</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: black;
  user-select: none;
  touch-action: manipulation;

  display: flex;
  justify-content: center;
  align-items: center;
}

#arrow {
  width: 65vw;
  max-width: 300px;
  aspect-ratio: 1 / 1;
  visibility: visible;
}

#control {
  position: fixed;
  bottom: calc(25px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);

  padding: 12px 35px;
  background: black;
  color: white;
  border: 2px solid white;
  border-radius: 6px;

  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<svg id="arrow" viewBox="0 0 200 200">
  <path
    d="M100 12
       L55 85
       L85 85
       L85 188
       L115 188
       L115 85
       L145 85
       Z"
    fill="white"
  />
</svg>

<button id="control">INIT</button>

<script>

const arrow = document.getElementById("arrow");
const control = document.getElementById("control");

let running = false;
let interval = null;

let leftCount = 0;
let rightCount = 0;

const MAX_DIFFERENCE = 4;

function changeDirection() {

  let direction;

  const difference = rightCount - leftCount;

  if (difference >= MAX_DIFFERENCE) {
    // Demasiadas apariciones a la derecha
    direction = "left";

  } else if (difference <= -MAX_DIFFERENCE) {
    // Demasiadas apariciones a la izquierda
    direction = "right";

  } else {
    // Probabilidad del 50%
    direction = Math.random() < 0.5 ? "left" : "right";
  }

  // Actualizar contadores
  if (direction === "left") {
    leftCount++;
  } else {
    rightCount++;
  }

  // Ocultar flecha
  arrow.style.visibility = "hidden";

  setTimeout(function() {

    // Girar 45 grados
    const angle = direction === "left" ? -45 : 45;

    arrow.style.transform = `rotate(${angle}deg)`;

    // Mostrar flecha
    arrow.style.visibility = "visible";

  }, 150);
}

function start() {

  if (running) return;

  running = true;
  control.textContent = "STOP";

  // Primera dirección inmediatamente
  changeDirection();

  // Cambiar automáticamente cada segundo
  interval = setInterval(changeDirection, 1000);
}

function stop() {

  running = false;

  clearInterval(interval);
  interval = null;

  // Reiniciar contadores
  leftCount = 0;
  rightCount = 0;

  control.textContent = "INIT";
}

control.addEventListener("click", function() {

  if (running) {
    stop();
  } else {
    start();
  }

});

</script>

</body>
</html>
