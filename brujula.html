
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Brújula</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: black;
  user-select: none;
  touch-action: manipulation;

  display: flex;
  justify-content: center;
  align-items: center;
}

#compass {
  width: 75vw;
  max-width: 350px;
  aspect-ratio: 1 / 1;
}

#arrow {
  width: 100%;
  height: 100%;
  transform: rotate(0deg);
  transition: transform 3s cubic-bezier(0.15, 0.65, 0.15, 1);
}

/* Zona invisible de reinicio */
#reset-area {
  position: fixed;
  bottom: 0;
  left: 25%;
  width: 50%;
  height: 15%;
  background: transparent;
  z-index: 10;
}
</style>
</head>

<body>

<div id="compass">
  <svg id="arrow" viewBox="0 0 200 200">
    <path
      d="M100 12
         L75 48
         L91 48
         L91 152
         L75 152
         L100 188
         L125 152
         L109 152
         L109 48
         L125 48
         Z"
      fill="white"
    />
  </svg>
</div>

<div id="reset-area"></div>

<script>

const arrow = document.getElementById("arrow");
const resetArea = document.getElementById("reset-area");

let currentAngle = 0;
let spinning = false;

// Contador de apariciones de cada posición
let counts = [0, 0, 0, 0, 0, 0];

// Obtener posiciones disponibles
function getAvailablePositions() {

  const available = [];

  // La posición 0 puede salir una primera vez siempre.
  // Para volver a salir, las posiciones 1-5
  // deben haber salido al menos dos veces.
  const allowSecondZero = counts.slice(1).every(count => count >= 2);

  for (let i = 0; i < 6; i++) {

    // Máximo tres apariciones por ciclo
    if (counts[i] >= 3) continue;

    // Restricción especial para la posición 0
    if (i === 0 && counts[0] >= 1 && !allowSecondZero) {
      continue;
    }

    available.push(i);
  }

  return available;
}

// Reiniciar todo el comportamiento
function resetCycle() {

  counts = [0, 0, 0, 0, 0, 0];

  currentAngle = 0;

  arrow.style.transition = "none";
  arrow.style.transform = "rotate(0deg)";

  // Forzar actualización visual antes de restaurar animación
  arrow.getBoundingClientRect();

  arrow.style.transition =
    "transform 3s cubic-bezier(0.15, 0.65, 0.15, 1)";

  spinning = false;
}

// Reiniciar al tocar la zona inferior central
resetArea.addEventListener("click", function(event) {
  event.stopPropagation();
  resetCycle();
});

// Girar al tocar el resto de la pantalla
document.addEventListener("click", function(event) {

  // Ignorar toques durante el giro
  if (spinning) return;

  // Ignorar la zona de reinicio
  if (resetArea.contains(event.target)) return;

  spinning = true;

  let available = getAvailablePositions();

  // Si no quedan posiciones, comenzar un nuevo ciclo
  if (available.length === 0) {
    resetCycle();
    spinning = true;
    available = getAvailablePositions();
  }

  // Elegir posición aleatoria
  const randomIndex = Math.floor(Math.random() * available.length);
  const destination = available[randomIndex];

  // Registrar aparición
  counts[destination]++;

  // Calcular giro
  const destinationAngle = destination * 30;

  const turns = 3 + Math.floor(Math.random() * 4);

  const currentPosition = currentAngle % 360;

  const adjustment =
    (destinationAngle - currentPosition + 360) % 360;

  currentAngle += turns * 360 + adjustment;

  arrow.style.transform = `rotate(${currentAngle}deg)`;

  // Liberar al terminar
  setTimeout(function() {
    spinning = false;
  }, 3000);

});

</script>

</body>
</html>
