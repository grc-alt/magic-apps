
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Brújula</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: black;
  user-select: none;
  touch-action: manipulation;

  display: flex;
  justify-content: center;
  align-items: center;
}

#compass {
  width: 75vw;
  max-width: 350px;
  aspect-ratio: 1 / 1;
}

#arrow {
  width: 100%;
  height: 100%;
  transform: rotate(0deg);
  transition: transform 3s cubic-bezier(0.15, 0.65, 0.15, 1);
}
</style>
</head>

<body>

<div id="compass">

  <svg id="arrow" viewBox="0 0 200 200">

    <path
      d="M100 12
         L75 48
         L91 48
         L91 152
         L75 152
         L100 188
         L125 152
         L109 152
         L109 48
         L125 48
         Z"
      fill="white"
    />

  </svg>

</div>

<script>

const arrow = document.getElementById("arrow");

let currentAngle = 0;
let spinning = false;

document.addEventListener("click", function() {

  // Evitar nuevas pulsaciones durante el giro
  if (spinning) return;

  spinning = true;

  // Posición aleatoria: 0, 30, 60, 90, 120 o 150 grados
  const destination = Math.floor(Math.random() * 6) * 30;

  // Entre 3 y 6 vueltas completas
  const turns = 3 + Math.floor(Math.random() * 4);

  // Calcular el giro necesario
  const currentPosition = currentAngle % 360;
  const adjustment = (destination - currentPosition + 360) % 360;

  currentAngle += turns * 360 + adjustment;

  // Aplicar giro
  arrow.style.transform = `rotate(${currentAngle}deg)`;

  // Permitir otra pulsación al terminar
  setTimeout(function() {
    spinning = false;
  }, 3000);

});

</script>

</body>
</html>
